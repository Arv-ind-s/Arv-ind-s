name: Generate Contribution Snake

on:
  schedule:
    # Regenerate twice a day so the snake stays fresh
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00e676&color_dots=#ebedf0,#9be9a8,#40e070,#26d653,#00c853
            dist/github-snake-dark.svg?color_snake=#39ff6a&color_dots=#161b22,#0e4429,#00b83a,#26e65a,#39ff6a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
